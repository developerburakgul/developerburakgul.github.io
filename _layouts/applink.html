<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="apple-itunes-app" content="app-id={{ page.app_id }}, app-argument={{ site.url }}{{ page.app_argument }}">
    <title>{{ page.app_name }}</title>
    <style>
        body {
            font-family: -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #f5f5f7;
            color: #1d1d1f;
            text-align: center;
        }
        .container { padding: 2rem; }
        h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        p { color: #6e6e73; margin-bottom: 1.5rem; }
        a {
            display: inline-block;
            background: #007aff;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>{{ page.app_name }}</h1>
        <p>Open in the app to continue.</p>
        <a href="https://apps.apple.com/app/id{{ page.app_id }}">Download on the App Store</a>
    </div>
</body>
</html>
